<!DOCTYPE html>
<html lang="zh-CN">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>动态表格 · 增删改查 + 导出CSV</title>
        <!-- 引入 Vue2 & ElementUI 样式与库 -->
        <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
        <script src="https://unpkg.com/vue@2/dist/vue.js"></script>
        <script src="https://unpkg.com/element-ui/lib/index.js"></script>
        <style>
            body {
                background: #f5f7fa;
                display: flex;
                justify-content: center;
                padding: 30px 20px;
                margin: 0;
                font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            }

            #app {
                width: 100%;
                max-width: 100%;
                background: #fff;
                border-radius: 12px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
                padding: 24px 28px 32px;
                box-sizing: border-box;
            }

            .table-header {
                display: flex;
                flex-wrap: wrap;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 20px;
                gap: 12px;
            }

            .table-header .left {
                display: flex;
                align-items: center;
                gap: 12px;
                flex-wrap: wrap;
            }

            .table-header .right {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
            }

            .search-input {
                width: 220px;
            }

            .el-table th.el-table__cell {
                background-color: #f0f2f5 !important;
                color: #1f2f3d;
                font-weight: 600;
            }

            .el-table .cell {
                line-height: 28px;
            }

            .action-buttons .el-button {
                margin: 0 2px;
            }

            .el-dialog .el-form-item {
                margin-bottom: 18px;
            }

            .tip {
                color: #909399;
                font-size: 13px;
                margin-top: 6px;
            }
        </style>
    </head>

    <body>
        <div id="app">
            <h2 style="margin-top: 0; font-weight: 500; display: flex; align-items: center; gap: 8px;">
                <i class="el-icon-s-grid" style="color: #409EFF;"></i> 动态表格 · 增删改查
            </h2>

            <!-- 顶部工具栏：搜索 + 新增 + 导出 -->
            <div class="table-header">
                <div class="left">
                    <el-input size="mini" v-model="searchKeyword" placeholder="搜索姓名/链接/作者" prefix-icon="el-icon-search"
                        class="search-input" clearable @input="handleSearch"></el-input>
                    <el-button size="mini" type="primary" icon="el-icon-plus" @click="openAddDialog">新增</el-button>
                </div>
                <div class="right">
                    <el-button size="mini" type="success" plain icon="el-icon-download"
                        @click="exportCSV">导出CSV</el-button>
                </div>
                <div class="right">
                    <el-button size="mini" type="success" plain icon="el-icon-download"
                        @click="exportTXT">导出TXT</el-button>
                </div>

                <div class="right">
                    <el-select v-model="selClass" size="mini" filterable default-first-option placeholder=""
                        @change="(e) => handleClassChange(e )">
                        <el-option v-for="item in arrClass" :key="item.value" :label="item.label" :value="item.value" />

                    </el-select>
                </div>

            </div>

            <!-- 表格 -->
            <el-table border style="width: 100%;  " row-key="id"
                :data="tableDataPack1.tableData.slice((tableDataPack1.nCurrentPage - 1) * tableDataPack1.nPageSize, tableDataPack1.nCurrentPage * tableDataPack1.nPageSize)"
                border :key="tableDataPack1.refreshKey" @sort-change="handleSortChange1"
                :header-cell-class-name="handleHeaderCellClass1">

                >
                <el-table-column prop="id" label="ID" width="70" align="center" sortable></el-table-column>
                <el-table-column prop="name" label="标题" width="150" sortable>
                    <template slot-scope="scope">
                        <a :href="scope.row.linkAddr" target="_blank">{{scope.row.name}}</a>
                    </template>
                </el-table-column>
                <!-- <el-table-column prop="linkAddr" label="链接" width="100"></el-table-column> -->
                <el-table-column prop="author" label="作者" width="100" sortable>


                </el-table-column>
                <el-table-column prop="shortContent" label="中文摘要">
                    <template slot-scope="scope">
                        <el-input size="mini" type="textarea" :autosize="{ minRows: 1, maxRows: 3}"
                            v-model="scope.row.shortContent"></el-input>
                    </template>
                </el-table-column>
                <el-table-column prop="classType" label="大分类" width="150">
                    <template slot-scope="scope">
                        <el-select :key="scope.$index" v-model="scope.row.classType" size="mini" filterable
                            @keyup.enter.native="(e) => handleClassEnter(e, scope.row)" default-first-option
                            placeholder="" @change="(e) => handleTargetSelect(e, scope.row)">
                            <el-option v-for="item in arrClass" :key="item.value" :label="item.label"
                                :value="item.value" />

                        </el-select>
                    </template>
                </el-table-column>
                <el-table-column prop="classType" label="小分类" width="150">
                    <template slot-scope="scope">
                        <el-select :key="scope.$index" v-model="scope.row.classType" size="mini" filterable
                            default-first-option placeholder="" @change="(e) => handleTargetSelect(e, scope.row)">
                            <el-option v-for="item in arrClass" :key="item.value" :label="item.label"
                                :value="item.value" />

                        </el-select>
                    </template>
                </el-table-column>

                <el-table-column label="操作" align="center" width="150">
                    <template slot-scope="scope">
                        <div class="action-buttons">
                            <el-button size="mini" type="primary" plain
                                @click="openEditDialog(scope.row)">编辑</el-button>
                            <el-button size="mini" type="danger" plain @click="deleteRow(scope.row)">删除</el-button>
                        </div>
                    </template>
                </el-table-column>
            </el-table>

            <!-- 分页器 -->
            <div class="block" style="margin-top:5px;margin-bottom:0px;">
                <el-pagination align='center' @size-change="handleSizeChange1" @current-change="handleCurrentChange1"
                    :current-page="tableDataPack1.nCurrentPage"
                    :page-sizes="[1, 2, 5, 10, 15, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000]"
                    :page-size="tableDataPack1.nPageSize" layout="total, sizes, prev, pager, next, jumper"
                    :total="tableDataPack1.tableData.length">
                </el-pagination>
            </div>

            <!-- 分页 (模拟, 由于纯前端数据量小, 只做展示) -->
            <!-- <div style="display: flex; justify-content: flex-end; margin-top: 10px;">
                <span style="color: #606266; font-size: 13px; margin-right: 10px;">共 {{ tableDataPack1.tableData.length }} 条</span>
            </div> -->

            <!-- 新增/编辑弹窗 -->
            <el-dialog :title="dialogTitle" :visible.sync="dialogVisible" width="520px" :close-on-click-modal="false"
                @close="resetForm">
                <el-form :model="form" :rules="rules" ref="formRef" label-width="80px" status-icon>
                    <el-form-item label="标题" prop="name">
                        <el-input v-model="form.name" placeholder="请输入姓名"></el-input>
                    </el-form-item>
                    <el-form-item label="链接" prop="linkAddr">
                        <el-input v-model="form.linkAddr" placeholder="请输入链接"></el-input>
                    </el-form-item>
                    <el-form-item label="摘要" prop="shortContent">
                        <el-input v-model="form.shortContent" placeholder="请输入摘要"></el-input>
                    </el-form-item>
                    <el-form-item label="中文摘要" prop="classType">
                        <el-input v-model="form.classType" placeholder="请输入角色"></el-input>
                    </el-form-item>
                </el-form>
                <span slot="footer" class="dialog-footer">
                    <el-button @click="dialogVisible = false">取消</el-button>
                    <el-button type="primary" @click="submitForm" :loading="submitLoading">确定</el-button>
                </span>
            </el-dialog>
        </div>

                            if (order == "ascending" || order == "descending") {

                                        else if (a[arrStr[0]][arrStr[1]][arrStr[2]] < b[arrStr[0]][arrStr[1]][arrStr[2]]) c = -1;

                            totalItem.forEach(item => {
                                const row = keys.map(key => {
                                    let value = item[key] !== undefined ? item[key] : '';
                                    // 如果内容包含制表符或换行，为了整齐，我们不做额外处理，但保留原样
                                    return value;
                                });
                                txtContent += row.join('\t') + '\n';
                            });

                            // 添加 UTF-16 LE BOM (FEFF)
                            const BOM = '\uFEFF';
                            // 将字符串按 UTF-16 LE 编码为字节数组
                            // 由于 Blob 支持指定编码，我们使用 Uint16Array 构造，但更简单是使用 TextEncoder 但浏览器不支持 utf-16
                            // 因此使用 Blob 的 options 指定 charset=utf-16le
                            // 但注意：Blob 的 charset 参数在部分浏览器可能不支持，所以我们手动构造 ArrayBuffer
                            // 更可靠的方式：构建 Uint16Array
                            const fullString = BOM + txtContent;
                            // 将字符串转为 UTF-16 LE 字节
                            const buf = new ArrayBuffer(fullString.length * 2); // 每个字符2字节
                            const view = new DataView(buf);
                            for (let i = 0; i < fullString.length; i++) {
                                const code = fullString.charCodeAt(i);
                                view.setUint16(i * 2, code, true); // little-endian
                            }
                            const blob = new Blob([buf], { type: 'text/plain;charset=utf-16le' });
                            this.downloadBlob(blob, `表格数据_${this.getDateStr()}.txt`);
                            this.$message.success('TXT (UTF-16) 导出成功');
                        },

                        // 辅助：下载 Blob
                        downloadBlob(blob, fileName) {
                            const link = document.createElement('a');
                            const url = URL.createObjectURL(blob);
                            link.href = url;
                            link.download = fileName;
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                            URL.revokeObjectURL(url);
                        },

                        // 辅助：获取日期字符串
                        getDateStr() {
                            const now = new Date();
                            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                        },

                        // 导出 CSV (基于当前过滤后的数据)
                        exportCSV() {

                            if (totalItem.length === 0) {
                                this.$message.warning('当前没有数据可导出');
                                return;
                            }
                            // 定义表头
                            const headers = ['ID', '标题', '链接', '作者', '中文摘要', '大分类'];
                            const keys = ['id', 'name', 'linkAddr', 'author', 'shortContent', 'classType'];

                            // 构建CSV内容
                            let csvContent = headers.join(',') + '\n';
                            totalItem.forEach(item => {
                                const row = keys.map(key => {
                                    let value = item[key] !== undefined ? item[key] : '';
                                    // 如果包含逗号、换行或双引号，进行转义
                                    if (typeof value === 'string' && (value.includes(',') || value.includes('"') || value.includes('\n'))) {
                                        value = `"${value.replace(/"/g, '""')}"`;
                                    }
                                    return value;
                                });
                                csvContent += row.join(',') + '\n';
                            });

                            // 添加BOM以便Excel正确识别UTF-8
                            const BOM = '\uFEFF';
                            const blob = new Blob([BOM + csvContent], { type: 'text/csv;charset=utf-8;' });
                            const link = document.createElement('a');
                            const url = URL.createObjectURL(blob);
                            link.href = url;
                            // 文件名包含日期
                            const now = new Date();
                            const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                            link.download = `表格数据_${dateStr}.csv`;
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                            URL.revokeObjectURL(url);
                            this.$message.success('CSV 导出成功');
                        }
                    },
                    watch: {
                        // 当tableData变化时，确保过滤刷新（但已经由各个操作调用handleSearch，此处作为兜底）
                        tableData: {
                            handler() {
                                // 但不要重复触发，避免循环
                            },
                            deep: true
                        }
                    }
                });
            })();
        </script>
    </body>

</html>
